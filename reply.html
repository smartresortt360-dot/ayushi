<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reply to an inquiry | AYUSHI</title>
  <style>
    :root { color-scheme: light; --bg: #FFF9F7; --card: #FFFFFF; --accent: #E8A6BE; --text: #211D23; --muted: #77717A; --soft: #FFF4EC; --line: #f0e2e5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 36px 18px; background: var(--bg); color: var(--text); font: 16px/1.6 Arial, Helvetica, sans-serif; }
    main { width: min(680px, 100%); margin: 0 auto; }
    .brand { margin: 8px 0 30px; text-align: center; }
    .brand a { color: inherit; text-decoration: none; font: 700 26px Georgia, serif; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 1.7px; }
    .panel { padding: clamp(22px, 5vw, 42px); background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 55px rgba(33, 29, 35, .07); }
    h1 { margin: 0 0 8px; font: normal 32px/1.2 Georgia, serif; }
    .intro { margin: 0 0 26px; color: var(--muted); }
    label { display: block; margin: 20px 0 7px; font-weight: 700; font-size: 13px; }
    input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 12px 13px; color: var(--text); background: #fff; font: inherit; }
    input[readonly], textarea[readonly] { background: var(--soft); color: var(--muted); }
    textarea { min-height: 150px; resize: vertical; }
    #originalMessage { min-height: 105px; }
    input:focus, textarea:focus { outline: 3px solid rgba(232, 166, 190, .3); border-color: var(--accent); }
    button { min-height: 48px; margin-top: 22px; padding: 0 22px; border: 0; border-radius: 7px; background: var(--accent); color: var(--text); font: 700 13px Arial, Helvetica, sans-serif; cursor: pointer; }
    button:hover { background: #e19ab4; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 24px; margin: 14px 0 0; color: var(--muted); }
    #status.error { color: #a22f43; }
    #status.success { color: #286849; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { body { padding: 22px 12px; } h1 { font-size: 28px; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <a href="./">AYUSHI <span style="color:#E8A6BE">✦</span></a>
      <p>CONTENT • SOCIAL MEDIA • DIGITAL</p>
    </header>
    <section class="panel" aria-labelledby="title">
      <h1 id="title">Write a reply</h1>
      <p class="intro">Your message will be sent directly to the person who contacted you.</p>
      <p id="loading" role="status">Loading inquiry details…</p>
      <form id="replyForm" hidden>
        <label for="clientName">Client</label>
        <input id="clientName" readonly />
        <label for="clientEmail">To</label>
        <input id="clientEmail" type="email" readonly />
        <label for="originalMessage">Original message</label>
        <textarea id="originalMessage" readonly></textarea>
        <label for="reply">Your reply</label>
        <textarea id="reply" maxlength="10000" required placeholder="Write your message…"></textarea>
        <button id="sendButton" type="submit">SEND REPLY</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    const EMAILJS_CONFIG = {
      serviceId: 'service_a98cp3h',
      replyTemplateId: 'template_replace_with_reply_template_id',
      publicKey: '5GkftVRg4MwLdj0CO',
      ownerName: 'Ayushi Malviya',
      ownerEmail: 'malviyaayushi87@gmail.com'
    };
    const params = new URLSearchParams(window.location.search);
    const inquiry = {
      name: params.get('name') || '',
      email: params.get('email') || '',
      message: params.get('message') || ''
    };
    const form = document.getElementById('replyForm');
    const status = document.getElementById('loading');
    const message = document.getElementById('status');

    function showError(text) {
      status.textContent = text;
      status.setAttribute('role', 'alert');
    }

    function loadInquiry() {
      if (!inquiry.name || inquiry.name.length > 120 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inquiry.email) || inquiry.message.length > 1800) {
        showError('This reply link is incomplete or invalid.');
        return;
      }
      document.getElementById('clientName').value = inquiry.name;
      document.getElementById('clientEmail').value = inquiry.email;
      document.getElementById('originalMessage').value = inquiry.message;
      status.hidden = true;
      form.hidden = false;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.className = '';
      message.textContent = '';
      if (!document.getElementById('reply').value.trim()) {
        message.className = 'error';
        message.textContent = 'Write a reply before sending.';
        return;
      }
      if (typeof emailjs === 'undefined') {
        message.className = 'error';
        message.textContent = 'Email service is unavailable. Please try again later.';
        return;
      }
      const button = document.getElementById('sendButton');
      button.disabled = true;
      button.textContent = 'SENDING…';
      try {
        await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.replyTemplateId, {
          to_email: document.getElementById('clientEmail').value.trim(),
          client_name: document.getElementById('clientName').value.trim(),
          owner_name: EMAILJS_CONFIG.ownerName,
          reply_to: EMAILJS_CONFIG.ownerEmail,
          reply: document.getElementById('reply').value.trim(),
          original_message: document.getElementById('originalMessage').value
        }, { publicKey: EMAILJS_CONFIG.publicKey });
        document.getElementById('reply').value = '';
        message.className = 'success';
        message.textContent = 'Your reply has been sent.';
      } catch (error) {
        console.error('EmailJS reply send failed:', error);
        message.className = 'error';
        message.textContent = 'Your reply could not be sent. Check the EmailJS reply template setup and try again.';
      } finally {
        button.disabled = false;
        button.textContent = 'SEND REPLY';
      }
    });

    loadInquiry();
  </script>
</body>
</html>
